# CI for Building Relay (feature 024).
#
# This runs from the PARENT repository, because that is the only place where all
# three trees exist at once: the tutorial's fence check replays chapters onto
# relay-platform, and neither submodule can verify that alone.
#
# Every command below is one a maintainer runs locally, verbatim. That is the
# point rather than a nicety: a green CI run has to mean what a green local run
# means, and a workflow that "helpfully" runs something slightly different is a
# workflow that goes green while the repository is broken.
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: relay-platform — the Docker-free gate
    runs-on: ubuntu-latest

    # NO SERVICE CONTAINERS, AND THAT IS THE WHOLE POINT OF THE SPLIT.
    #
    # `pnpm lint`, `pnpm typecheck` and `pnpm test` are chapter 1.1's Docker-free gate, and
    # for nine chapters they ran in a job that starts five stores — so "Docker-free" was a
    # claim nothing tested. Here it is tested by the absence of anything to connect to:
    # if a unit test needs a broker, this job is where it says so.
    #
    # AND THE SPLIT IS WHAT MAKES THE OTHER JOB LEGIBLE. In one job there is no
    # `continue-on-error`, so a failing unit test skipped `pnpm build`, the migration, the
    # analytical schema, the error-registry gate and the whole integration lane — five
    # results hidden behind one, with `pnpm coverage` running anyway on its `if: always()`
    # and reporting `UNKNOWN_TABLE` for a schema that was never applied. Measured on a real
    # run before this change (`gaps.md` 056-9). Two jobs cannot hide each other.
    #
    # THE COST IS THREE SECONDS. `pnpm install` is 3s on a warm cache, and the two jobs run
    # in parallel where the one job ran its 34 seconds of gates in series ahead of a
    # 242-second coverage run.
    defaults:
      run:
        working-directory: relay-platform

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        # WHICH package.json. This repository has none at its root — it is the
        # superproject, and `packageManager` lives in each submodule. Without this
        # the action reads the root, finds nothing, and fails before any job runs.
        # Pinning `version:` here instead would be a second place to change when
        # the submodule's pnpm moves, and the two would drift in silence.
        with:
          package_json_file: relay-platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The Docker-free gate, exactly as chapter 1.1 defined it.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test


  lanes:
    name: relay-platform — integration lanes and coverage
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay
      RELAY_REDIS_URL: redis://localhost:6379
      RELAY_CLICKHOUSE_HOST: localhost
      RELAY_NATS_URL: nats://localhost:4222
      # The outbox relay stays off in the test lane, for the reason chapter 3.3
      # found the hard way: a background daemon draining the table two suites
      # are asserting on is a race between test files, not a property.
      RELAY_OUTBOX_RELAY: "off"
      # Chapter 3.5's two loops, off for the same reason as 3.3's.
      RELAY_EVENT_CONSUMER: "off"
      RELAY_DELIVERY_RELAY: "off"
      # The dispatcher authenticates to the api with this, and the api decrypts
      # webhook signing secrets with the other. Throwaway CI values, in the file
      # rather than in secrets on purpose: they guard nothing here, and a build
      # that cannot be reproduced from what is committed is worse than a key
      # everyone can read. Production supplies both from its own store.
      #
      # A REAL KEY, not an empty string. `""` is falsy, so it would have taken
      # the development fallback inside `encryptionKey()` — CI would exercise
      # the branch that never ships and leave the configured one unmeasured.
      RELAY_INTERNAL_CREDENTIAL: rk_svc_ci_0123456789abcdef0123456789abcdef
      RELAY_WEBHOOK_SECRET_KEY: "BpDal75yBZp7Fc2GtGS3D1vh7qOKgCWJkF6/d0XWxBU="

      # NOTE: no per-service CI job. Every command in this workflow already runs
      # at the workspace root — `pnpm lint`, `pnpm typecheck`, `pnpm test`,
      # `pnpm build`, `pnpm test:integration`, `pnpm coverage` — so a new package
      # is covered the moment it exists. Adding a `dispatcher` job would have
      # been ceremony that runs the same commands twice.
      #
      # THE SPLIT ABOVE IS NOT THAT. `gates` and `lanes` run DIFFERENT commands and
      # need different infrastructure: one is the Docker-free gate and starts no
      # stores, the other needs five. The objection to a per-service job was that it
      # would duplicate work; this divides it, and the duplication is one
      # `pnpm install` at three seconds.

    defaults:
      run:
        working-directory: relay-platform

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        # WHICH package.json. This repository has none at its root — it is the
        # superproject, and `packageManager` lives in each submodule. Without this
        # the action reads the root, finds nothing, and fails before any job runs.
        # Pinning `version:` here instead would be a second place to change when
        # the submodule's pnpm moves, and the two would drift in silence.
        with:
          package_json_file: relay-platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # THE STORES COME FROM `compose.yaml`, NOT FROM SERVICE CONTAINERS.
      #
      # This job used four GitHub service containers — postgres, redis, nats and
      # clickhouse — restating images, credentials, ports and health checks that
      # `compose.yaml` already declares. Restating them is how they drift, and they had:
      #
      #   nats     compose runs `-js -sd /data -m 8222`; the service container had NO
      #            command, because a service container has no field that supplies one.
      #            **JetStream was off.** Every durable-stream suite in the repository
      #            answers `NatsError: 503` against it — 1,805 occurrences in one run —
      #            and `/healthz` says nothing about JetStream, so the check was green
      #            throughout. Reproduced against a bare `nats:2.12-alpine`:
      #            `jetstreamManager(): NatsError: 503`, `publish: NatsError: 503`.
      #   mailpit  absent entirely. Three suites assert on what an operator receives —
      #            `notifications`, `quotas`, `connections` — roughly eighteen tests.
      #   minio    the same command problem, found at chapter 4.10 and worked around
      #            with a one-service compose call. This generalises that fix.
      #
      # SO CI RUNS THE FILE A DEVELOPER RUNS. Image, credentials, command, volume,
      # health check and published port all come from one place, `--wait` is the health
      # check compose already declares, and the `env:` block below still addresses
      # `localhost` on the same ports because those are compose's own defaults. The
      # services behind `--profile services` are Relay's own and stay down: this job
      # tests the code in the repository, not an image of it.
      #
      # AND THE `docs/07` §6 CLAIM BECOMES TRUE HERE TOO — *"runs both lanes against
      # real stores"* — for the same reason chapter 4.8 had to provision ClickHouse:
      # a lane that passes locally passes here only if "here" is the same stack.
      - run: docker compose up -d --wait postgres redis nats clickhouse minio mailpit

      # Migrations before the integration lane: the suites expect the schema the
      # migration runner produces, not the one drizzle-kit imagines.
      - run: pnpm build
      - run: node services/api/dist/db/migrate.js

      # THE ANALYTICAL SCHEMA, WHICH NOTHING ELSE CREATES. `CLICKHOUSE_DB` makes the
      # database and not its tables; four chapters' suites read tables this statement
      # runner is the only thing that builds (chapter 4.2).
      - run: node analytics/apply.mjs

      # ── THE ERROR REGISTRY GATE MOVED ABOVE THE LANE (chapter 4.8) ──────────────
      #
      # It used to run last in this job, after `pnpm test:integration`. There is no
      # `continue-on-error` here, so a red lane meant this step never executed — and it
      # is the gate that compares `ERROR_CODES` against `docs/08-error-reference.md` in
      # both directions. A gate that exists and cannot be reached is the same as no
      # gate. It needs only `pnpm build`, which ran above.
      - run: node ../relay-tutorial/scripts/check-error-codes.mjs

      - run: pnpm test:integration

      # Constitution VI's measurable half. Runs both lanes again under
      # instrumentation, which is slower and is the only honest way to measure
      # code that integration tests reach.
      #
      # `if: always()` FOR THE SAME REASON THE GATE ABOVE MOVED: this figure is what
      # constitution VI's 70% clause is measured in, and without the guard it is skipped
      # on exactly the runs where something is already wrong.
      - if: always()
        run: pnpm coverage

      # (The error-registry gate that used to close this job now runs above the lane;
      # its full argument — why it is a CI step rather than a turbo task, and why it
      # lives in this job rather than the tutorial's — is unchanged and sits there.)

  tutorial:
    name: relay-tutorial — build, docs drift, fence chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-tutorial/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-tutorial/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: relay-tutorial

      - run: pnpm lint
        working-directory: relay-tutorial
      - run: pnpm build
        working-directory: relay-tutorial

      # The three checks that keep the series honest: prose mirrors its sources,
      # every fenced file replays onto the canonical repository byte for byte,
      # and every figure hands its diagram to the prop the component reads. The
      # fence check needs relay-platform, which is why this job checks out
      # submodules too.
      #
      # `check:figures` was added in chapter 3.15, after fifteen figures in four
      # published chapters were found rendering a caption over nothing: MDX props
      # are not type-checked, so `chart={figThing}` builds green and passes
      # `code: undefined`.
      - run: pnpm check:docs
        working-directory: relay-tutorial
      - run: pnpm check:srs
        working-directory: relay-tutorial
      - run: pnpm check:figures
        working-directory: relay-tutorial
      - run: pnpm check:fences
        working-directory: relay-tutorial

  outsider:
    name: relay-platform — the sealed integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-platform/pnpm-lock.yaml

      # The four steps every job in this workflow opens with. `pnpm build` is not
      # optional here: `node services/api/dist/db/migrate.js` runs from build
      # output two steps down.
      - run: pnpm install --frozen-lockfile
        working-directory: relay-platform
      - run: pnpm build
        working-directory: relay-platform

      # A SEPARATE JOB, not three lines in the platform job. That job uses GitHub
      # service containers on `localhost:5432` while compose's api reads
      # `postgres:5432` on its own network — so adding `--profile services` there
      # would start a second database, migrate the first, and leave the api serving
      # a schema that does not exist. The price of the target being external is
      # building two Node images every run.
      #
      # `RELAY_POSTGRES_PORT=15432` ON EVERY COMPOSE CALL. `compose.yaml` defaults
      # the host port to 5432 and the code defaults to 15432, so a bare `up`
      # publishes a database the migration a line later cannot reach.
      - run: RELAY_POSTGRES_PORT=15432 docker compose up -d --wait
        working-directory: relay-platform
      # `working-directory`, WHICH THIS STEP DID NOT HAVE AND EVERY OTHER STEP IN THIS JOB
      # DOES. Two of the three jobs in this workflow set it once under `defaults`; this one
      # repeats it per step, and the repetition is what made it possible to miss — so the
      # job died here, every run, on:
      #
      #     Error: Cannot find module
      #       '/home/runner/work/relay/relay/services/api/dist/db/migrate.js'
      #
      # The path is missing `relay-platform/`. **THE SEALED SUITE HAS THEREFORE NEVER RUN IN
      # CI**: the job exists, it is red, and it has never reached the thing it is named for.
      # Chapter 4.9 found the same shape in the integration gate — *"the gate was already
      # red, so a planted drift deepened a red rather than turning one"* — and 4.10 found
      # `pnpm test:integration` skipped for nine features. A job's colour says nothing about
      # which step produced it.
      - run: DATABASE_URL=postgres://relay:relay@localhost:15432/relay node services/api/dist/db/migrate.js
        working-directory: relay-platform

      # THE ANALYTICAL SCHEMA, WHICH THIS JOB WAS MISSING AND ITS SIBLING HAS.
      #
      # `migrate.js` builds Postgres and nothing builds ClickHouse: `CLICKHOUSE_DB` makes
      # the database and not its tables, and `analytics/apply.mjs` is the only thing that
      # creates them (chapter 4.2). Without it `GET /v1/request-log` answers **500** —
      # measured, as `expected 500 to be 200` in the sealed suite's request-log test — for
      # a route that is working perfectly against a schema that is not there.
      #
      # The `lanes` job has run this since chapter 4.8. This one never did, and nothing
      # noticed because the sealed suite's request-log test was the first to ask.
      - run: RELAY_CLICKHOUSE_HOST=localhost node analytics/apply.mjs
        working-directory: relay-platform

      # `--build` is not optional either, and this is measured rather than
      # cautious: the suite ran against a stale image once and reported six
      # failures — 404s for routes that exist and a docs_url from two chapters
      # earlier — none of which named the cause.
      - run: RELAY_POSTGRES_PORT=15432 docker compose --profile services build
        working-directory: relay-platform
      - run: RELAY_POSTGRES_PORT=15432 docker compose --profile services up -d --wait
        working-directory: relay-platform

      # Stores, migrations, services, seed, suite. The seed writes rows the api's
      # schema must already accept; the suite needs a credential that must already
      # exist. There is no public way to obtain one — sign-up ends at an OAuth
      # consent screen and key management is the dashboard's chapter.
      - name: Seed a demo tenant and run the sealed suite
        working-directory: relay-platform
        run: |
          RELAY_DEMO_CREDENTIAL=$(RELAY_POSTGRES_PORT=15432 node scripts/seed-demo-tenant.mjs)
          export RELAY_DEMO_CREDENTIAL
          export RELAY_API_URL=http://localhost:4000
          export RELAY_WS_URL=ws://localhost:4001
          pnpm test:outsider

      - name: What the services said, if anything went wrong
        if: failure()
        working-directory: relay-platform
        run: RELAY_POSTGRES_PORT=15432 docker compose --profile services logs --tail 200
